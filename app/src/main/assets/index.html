<!doctype html>
<html lang="fa">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#15161A">
<title>پیانوی سفارشی</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600&family=Share+Tech+Mono&family=Vazirmatn:wght@400;500;700&display=swap">
<style>html{box-sizing:border-box;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}body{margin:0}</style>
<style>
/* Concept: one piano fills the screen; a Korg-style workstation panel (LCD, knobs, hardware tabs) slides over the top so the sound can be edited while the keys stay playable below. */
:root{
  color-scheme:dark;
  --chassis:#15161A; --panel:#1E2025; --raised:#2A2D34; --inset:#101114; --line:#393D46;
  --fg:#E8EAED; --muted:#8F95A0;
  --led:#FF8A1F; --led-dim:#4A2C10; --danger:#FF6B5E;
  --lcd:#061A33; --lcd-2:#0B2C55; --lcd-fg:#BFE4FF; --lcd-dim:#5F88B3; --lcd-hi:#FFC247;
  --cap:#34373E; --cap-edge:#4D515B; --groove:#0B0C0E; --felt:#8F2B38;
  --key-w:#F6F5F0; --key-w-shade:#E0DFD8; --key-w-edge:#8A8D93; --key-w-down:#FFD59A;
  --key-b:#26282C; --key-b-2:#08090A; --key-b-down:#FF8A1F;
  --label-w:#5B6068; --label-b:#AEB3BB;
  --font-body:'Vazirmatn',system-ui,sans-serif;
  --font-label:'Chakra Petch','Vazirmatn',system-ui,sans-serif;
  --font-lcd:'Share Tech Mono',ui-monospace,Menlo,monospace;
}
html,body{height:100%}
body{background:var(--chassis);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.6;direction:rtl;overflow:hidden}
#app{height:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:10px;padding-inline:16px;padding-block:10px}
button,select,input{font-family:inherit}

/* ---------- stage (piano) ---------- */
#stage{flex:1 1 0;min-height:0;display:flex;flex-direction:column;gap:8px}
#app.open #stage{flex:0 0 clamp(150px,32%,260px)}
.topbar{display:flex;align-items:center;gap:14px;min-height:40px}
.gear{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px 0 16px;border:1px solid var(--line);border-radius:10px;background:linear-gradient(#33363D,#25272C);color:var(--fg);cursor:pointer;font-size:14px}
.gear svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.gear[aria-expanded="true"]{border-color:var(--led);color:var(--led)}
#rail{flex:1;direction:ltr;margin:0;accent-color:var(--led)}
.deck{position:relative;flex:1 1 0;min-height:0;overflow:hidden;border-radius:10px;background:var(--inset);border-top:6px solid var(--felt);touch-action:none;-webkit-touch-callout:none}
.kb{position:absolute;bottom:0;left:0;user-select:none;-webkit-user-select:none;touch-action:none;direction:ltr}
.key{position:absolute;top:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;box-sizing:border-box;cursor:pointer;-webkit-tap-highlight-color:transparent}
.key *{pointer-events:none}
.white{background:linear-gradient(to bottom,var(--key-w) 72%,var(--key-w-shade));border:1px solid var(--key-w-edge);border-top:0;border-radius:0 0 6px 6px;color:var(--label-w);padding-bottom:10px;z-index:1}
.white.down{background:var(--key-w-down)}
.black{background:linear-gradient(to bottom,var(--key-b),var(--key-b-2));border-radius:0 0 4px 4px;color:var(--label-b);padding-bottom:8px;z-index:2;box-shadow:inset 0 -3px 0 rgba(255,255,255,.08),1px 0 0 rgba(0,0,0,.6)}
.black.down{background:var(--key-b-down);color:var(--chassis)}
.key.sel{outline:2px solid var(--led);outline-offset:-4px}
.key.drop{outline:2px dashed var(--lcd-hi);outline-offset:-4px}
.dot{display:none;width:7px;height:7px;border-radius:50%;background:var(--led)}
.has .dot{display:block}
.key.tuned::after{content:attr(data-tn);position:absolute;top:8px;font:600 10px var(--font-label);color:var(--led);pointer-events:none}
.black.tuned::after{color:var(--lcd-hi);top:6px}
.lbl{font:500 12px var(--font-label);line-height:1;white-space:nowrap}
@media (prefers-reduced-motion:no-preference){.white,.black{transition:background-color .05s}}

/* ---------- settings ---------- */
#settings{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:10px}
.shead{display:flex;align-items:center;justify-content:space-between;gap:12px}
.shead h1{margin:0;font-size:18px;font-weight:700}
.btn{font:inherit;min-height:38px;padding:6px 14px;border:1px solid var(--line);border-radius:8px;background:linear-gradient(#32353C,#25272C);color:var(--fg);cursor:pointer}
.btn.primary{border-color:var(--led);color:var(--led)}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.lcd{display:grid;grid-template-columns:1fr auto;grid-template-areas:"tab scope" "prog scope" "read read";gap:2px 14px;direction:ltr;padding:9px 14px;background:linear-gradient(180deg,var(--lcd-2),var(--lcd));border:1px solid #000;border-radius:8px;box-shadow:inset 0 0 0 2px var(--groove),inset 0 0 22px rgba(0,0,0,.55);font-family:var(--font-lcd);color:var(--lcd-fg)}
#lcdTab{grid-area:tab;font-size:12px;letter-spacing:.14em;color:var(--lcd-dim);text-transform:uppercase}
#lcdProg{grid-area:prog;font-size:21px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#lcdRead{grid-area:read;font-size:13px;color:var(--lcd-hi);min-height:1.5em;unicode-bidi:plaintext;text-align:start;font-family:var(--font-body)}
#scope{grid-area:scope;width:140px;height:48px;align-self:center;border-radius:4px;background:rgba(0,0,0,.28)}
.tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(86px,1fr));gap:6px}
.tab{display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 6px 6px;border:1px solid var(--line);border-radius:7px;background:linear-gradient(#32353C,#24262B);color:var(--muted);cursor:pointer;position:relative}
.tab::before{content:"";width:16px;height:4px;border-radius:2px;background:var(--led-dim);margin-bottom:3px}
.tab .en{font:600 11px var(--font-label);letter-spacing:.14em}
.tab .fa{font-size:12px}
.tab[aria-selected="true"]{color:var(--fg);border-color:#555a66}
.tab[aria-selected="true"]::before{background:var(--led);box-shadow:0 0 8px var(--led)}
.body{flex:1 1 0;min-height:0;overflow-y:auto;overscroll-behavior:contain;display:grid;gap:12px;align-content:start;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));padding-bottom:6px}
.mod{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px 12px;min-width:0;display:flex;flex-direction:column;gap:10px}
.mod.wide{grid-column:1/-1}
.mod h3{margin:0;display:flex;align-items:center;justify-content:space-between;gap:10px;font:600 12px var(--font-label);letter-spacing:.14em;text-transform:uppercase;color:var(--led)}
.mod h3 small{font:400 12px var(--font-body);letter-spacing:0;color:var(--muted);text-transform:none}
.knobs{display:flex;flex-wrap:wrap;gap:12px 8px;direction:ltr;align-items:flex-start}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.hint{margin:0;font-size:13px;color:var(--muted);line-height:1.8}
.src{margin:0;font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.big{font:600 26px var(--font-label);direction:ltr;text-align:start}
select{min-height:36px;padding:4px 10px;border:1px solid var(--line);border-radius:7px;background:var(--inset);color:var(--fg);max-width:100%}
input[type="text"]{min-height:36px;padding:4px 10px;border:1px solid var(--line);border-radius:7px;background:var(--inset);color:var(--fg);min-width:0;flex:1 1 140px}
.fld{display:grid;gap:4px;font-size:12px;color:var(--muted)}
.led{display:inline-flex;align-items:center;gap:8px;min-height:34px;padding:4px 12px;border:1px solid var(--line);border-radius:7px;background:linear-gradient(#32353C,#24262B);color:var(--fg);cursor:pointer;font-size:13px}
.led i{width:9px;height:9px;border-radius:50%;background:var(--led-dim)}
.led[aria-pressed="true"]{border-color:#5a5f6b}
.led[aria-pressed="true"] i{background:var(--led);box-shadow:0 0 8px var(--led)}
.seg{display:inline-flex;gap:4px;direction:ltr}
.seg .led{min-width:76px;justify-content:center}
.chips{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;direction:ltr}
.chip{min-height:30px;padding:2px 12px;border:1px solid var(--line);border-radius:999px;background:var(--panel);color:var(--muted);cursor:pointer;font:500 12px var(--font-label);letter-spacing:.06em}
.chip[aria-pressed="true"]{color:var(--chassis);background:var(--led);border-color:var(--led)}
.tiles{grid-column:1/-1;display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));direction:ltr}
.tile{display:flex;align-items:center;gap:8px;min-height:44px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:linear-gradient(#2E3138,#23252A);color:var(--fg);cursor:pointer;text-align:start;position:relative}
.tile .num{font:12px var(--font-lcd);color:var(--lcd-dim);background:var(--lcd);padding:1px 5px;border-radius:3px;white-space:nowrap}
.tile .nm{font:500 13px var(--font-label);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile[aria-pressed="true"]{border-color:var(--led);box-shadow:0 0 0 1px var(--led) inset}
.tile[aria-pressed="true"] .num{color:var(--lcd-hi)}
.tile .x{margin-inline-start:auto;border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:16px;line-height:1;padding:2px 4px}
.writebar{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.knob{width:66px;display:flex;flex-direction:column;align-items:center;gap:3px;touch-action:none;cursor:ns-resize;border-radius:8px;user-select:none;-webkit-user-select:none}
.knob svg{display:block}
.knob .cap{fill:var(--cap);stroke:var(--cap-edge);stroke-width:1}
.knob .trk{fill:none;stroke:var(--groove);stroke-width:4;stroke-linecap:round}
.knob .val{fill:none;stroke:var(--led);stroke-width:4;stroke-linecap:round}
.knob .ind{stroke:var(--fg);stroke-width:2.2;stroke-linecap:round}
.kname{font:500 10.5px var(--font-label);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:center;line-height:1.2}
.kval{font:12px var(--font-lcd);background:var(--lcd);color:var(--lcd-fg);padding:1px 6px;border-radius:3px;min-width:48px;text-align:center;white-space:nowrap}
.eg{width:132px;height:54px;flex:none;border-radius:4px;background:var(--groove)}
.eg path{fill:none;stroke:var(--led);stroke-width:1.6;stroke-linejoin:round}
.step{display:inline-flex;align-items:center;gap:6px;direction:ltr}
.step b{min-width:64px;text-align:center;font:15px var(--font-lcd);background:var(--lcd);color:var(--lcd-fg);padding:5px 8px;border-radius:4px}
.step .btn{min-width:42px;padding:6px 10px;font-size:18px;line-height:1}
.fxtag{font:500 10px var(--font-label);letter-spacing:.1em;color:var(--lcd-dim);border:1px solid var(--line);border-radius:4px;padding:0 6px}
:focus-visible{outline:2px solid var(--led);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-height:520px){
  #scope{display:none}
  .lcd{grid-template-areas:"tab" "prog" "read";grid-template-columns:1fr;padding:5px 12px}
  #lcdProg{font-size:16px}
  #app.open #stage{flex:0 0 128px}
  .shead{display:none}
  .tab{padding:4px 6px}
  .topbar{min-height:34px}
}
</style>
</head>
<body>
<div id="app" dir="rtl" lang="fa">
  <section id="settings" hidden aria-label="تنظیمات">
    <div class="shead">
      <h1>تنظیمات</h1>
      <button type="button" class="btn primary" id="btnClose">بازگشت به پیانو</button>
    </div>
    <div class="lcd" aria-live="polite">
      <div id="lcdTab"></div>
      <div id="lcdProg"></div>
      <canvas id="scope" width="140" height="48" aria-hidden="true"></canvas>
      <div id="lcdRead"></div>
    </div>
    <nav class="tabs" id="tabs" aria-label="بخش‌های تنظیمات"></nav>
    <div class="body" id="tabBody"></div>
  </section>

  <section id="stage" aria-label="پیانو">
    <div class="topbar">
      <button type="button" class="gear" id="btnSet" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        <span>تنظیمات</span>
      </button>
      <input type="range" id="rail" min="0" max="100" step="1" value="0" hidden aria-label="جابجایی نمای صفحه‌کلید">
    </div>
    <div class="deck" id="deck"><div class="kb" id="kb"></div></div>
  </section>

  <input type="file" id="fileOne" accept="audio/*" hidden>
  <input type="file" id="fileMany" accept="audio/*" multiple hidden>
  <input type="file" id="fileBase" accept="audio/*" hidden>
</div>

<script>

 {id:'pad',cat:'Strings & Pad',name:'Warm Pad',p:{osc1:{wave:'sawtooth',fine:-9,level:.45},osc2:{wave:'triangle',fine:9,level:.6},sub:.2,filter:{cutoff:1400,res:1,env:1,key:.4},feg:{a:1.4,d:2,s:.6,r:1.5},amp:{a:1.2,d:1,s:.9,r:1.8},lfo:{rate:.25,filter:400},out:{spread:.9}}},
 {id:'brass',cat:'Brass & Wind',name:'Brass',p:{osc1:{wave:'sawtooth',level:.6},osc2:{wave:'sawtooth',fine:8,level:.5},filter:{cutoff:900,res:3,env:2.6,key:.6},feg:{a:.09,d:.4,s:.5,r:.2},amp:{a:.05,d:.3,s:.85,r:.18}}},
 {id:'flute',cat:'Brass & Wind',name:'Flute',p:{osc1:{wave:'sine',level:.8},osc2:{wave:'triangle',oct:1,level:.12},noise:.08,filter:{cutoff:3500,res:.7,key:.6},amp:{a:.09,d:.2,s:.9,r:.15},lfo:{rate:5,pitch:8}}},
 {id:'lead',cat:'Lead',name:'Synth Lead',p:{osc1:{wave:'square',level:.5},osc2:{wave:'sawtooth',fine:9,level:.5},filter:{cutoff:3800,res:6,env:1.2,key:.7},amp:{a:.005,d:.2,s:.8,r:.15},feg:{d:.3,s:.4},lfo:{rate:5.5,pitch:12}}},

var raf=0,scopeBuf=null;
function drawScope(){
  if(!S.open){raf=0;return}
  raf=requestAnimationFrame(drawScope);
  var c=$('scope'),x=c.getContext('2d'),w=c.width,hh=c.height;
  x.clearRect(0,0,w,hh);
  var cs=getComputedStyle(document.documentElement);
  x.strokeStyle=cs.getPropertyValue('--lcd-dim').trim();x.globalAlpha=.35;x.lineWidth=1;x.beginPath();x.moveTo(0,hh/2);x.lineTo(w,hh/2);x.stroke();x.globalAlpha=1;
  if(!analyser)return;
  if(!scopeBuf)scopeBuf=new Uint8Array(analyser.fftSize);
  analyser.getByteTimeDomainData(scopeBuf);
  x.strokeStyle=cs.getPropertyValue('--lcd-fg').trim();x.lineWidth=1.5;x.beginPath();
  for(var i=0;i<w;i++){var v=scopeBuf[Math.floor(i*scopeBuf.length/w)]/128-1,y=hh/2+v*hh*.45;if(i)x.lineTo(i,y);else x.moveTo(i,y)}
  x.stroke();
}

      else if(r.id.charAt(0)==='n')samples.set(+r.id.slice(1),{buffer:buffer,name:r.name})}catch(e){}}
  markKeys();if(S.open)renderTab();
});
})();
</script>
